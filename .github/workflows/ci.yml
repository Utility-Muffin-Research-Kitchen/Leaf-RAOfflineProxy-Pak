name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    # arm64, deliberately. The pinned toolchain image is multi-arch, so on an
    # x86_64 runner it runs as amd64 -- and CPython's configure then cannot
    # execute the aarch64 test binaries it just compiled ("cannot run C
    # compiled programs", exit 77). On an arm64 host those binaries run
    # natively, which is why this build has always worked on the development
    # machine and nowhere else. Building here the same way the artifact is
    # actually produced is also the point: CI and release should not differ in
    # host architecture.
    runs-on: ubuntu-24.04-arm

    steps:
      # Full history with tags: the version-metadata check must see which
      # versions are already published, and the state test rebuilds the
      # published 0.1.0 from its tag.
      - name: Checkout RAOfflineProxy pak
        uses: actions/checkout@v4
        with:
          path: Leaf-RAOfflineProxy-Pak
          fetch-depth: 0

      # Siblings are pinned rather than tracked. A Catastrophe or Jawaka change
      # must not be able to break -- or silently fix -- this pak's build without
      # a deliberate bump in release-lock.json.
      - name: Read release lock
        id: release-lock
        working-directory: Leaf-RAOfflineProxy-Pak
        run: |
          python3 - <<'PY'
          import json
          import os

          lock = json.load(open("release-lock.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in ("catastrophe_commit", "jawaka_commit", "leaf_commit"):
                  output.write(f"{key}={lock[key]}\n")
              output.write(f"toolchain={lock['mlp1_toolchain_image']}\n")
          PY

      - name: Checkout pinned Catastrophe
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/Catastrophe
          ref: ${{ steps.release-lock.outputs.catastrophe_commit }}
          path: Catastrophe

      - name: Checkout pinned Jawaka
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/Jawaka
          ref: ${{ steps.release-lock.outputs.jawaka_commit }}
          path: Jawaka

      - name: Checkout pinned Leaf
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/Leaf
          ref: ${{ steps.release-lock.outputs.leaf_commit }}
          path: Leaf

      - name: Check Python sources compile
        working-directory: Leaf-RAOfflineProxy-Pak
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m py_compile src/raofflineproxy/*.py

      # Every source input carries a URL, size and SHA-256, so the cache key is
      # the lock files themselves: a re-pin invalidates it by construction and
      # can never serve a stale archive.
      - name: Cache locked source archives
        uses: actions/cache@v4
        with:
          path: Leaf-RAOfflineProxy-Pak/workdir/sources
          key: raop-sources-${{ hashFiles('Leaf-RAOfflineProxy-Pak/locks/*.json') }}

      # Cheap, and the one gate that protects a pak already on the card when
      # Leaf is rolled back.
      - name: Run the Leaf version gate test
        working-directory: Leaf-RAOfflineProxy-Pak
        run: make test-version-gate

      # pak.json, release-lock.json and floor/requirements carry one version
      # pair, and the version is not one already published.
      - name: Check the version metadata
        working-directory: Leaf-RAOfflineProxy-Pak
        run: make test-version-metadata

      # chdman converts the same synthetic discs the CHD reader test writes,
      # so the layout is checked against the reference tool too. The Pak Rat
      # client the catalog smoke builds needs SQLite and libcurl headers.
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mame-tools libsqlite3-dev libcurl4-openssl-dev

      # Probe shape after the upstream refresh: bounded request path, cached
      # negative probes, background-only forced retries, carrier fallback.
      - name: Run the network fixtures
        working-directory: Leaf-RAOfflineProxy-Pak
        run: make test-network-fixtures

      # Pending awards flush with their owner's own token after an account
      # switch; offline hardcore, other-account and leaderboard entries are
      # refused, never queued.
      - name: Run the account guard fixtures
        working-directory: Leaf-RAOfflineProxy-Pak
        run: make test-account-guard

      # Primary-card games resolve against the launcher card; missing ROMs and
      # track files report as missing, never as prepared or "No RA data".
      - name: Run the pre-cache fixtures
        working-directory: Leaf-RAOfflineProxy-Pak
        run: make test-precache-fixtures

      # The two CHD reader fixes (GD-ROM track padding, unstored pregaps) on
      # synthetic discs, hashed through the real rc_hash entry point.
      - name: Run the CHD reader test
        working-directory: Leaf-RAOfflineProxy-Pak
        env:
          RAOP_REQUIRE_CHDMAN: "1"
        run: make test-chd-reader

      # Upgrade from and roll back to the published 0.1.0 over one state
      # directory. The baseline is rebuilt from the v0.1.0 tag and must equal
      # the app tree inside the published release asset.
      - name: Run the 0.1.0 state upgrade and rollback test
        working-directory: Leaf-RAOfflineProxy-Pak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --pattern RAOfflineProxy.mlp1.pak.zip --dir "$RUNNER_TEMP/published-0.1.0"
          BASELINE_PUBLISHED_ZIP="$RUNNER_TEMP/published-0.1.0/RAOfflineProxy.mlp1.pak.zip" \
            make test-state-compat

      # The package build needs the pinned toolchain image. If it cannot be
      # pulled this job fails: a green run that skipped packaging would claim
      # a build nobody made.
      - name: Check pinned MLP1 toolchain availability
        env:
          MLP1_TOOLCHAIN_IMAGE: ${{ steps.release-lock.outputs.toolchain }}
        run: |
          if ! docker manifest inspect "$MLP1_TOOLCHAIN_IMAGE" >/dev/null; then
            echo "::error::Pinned MLP1 toolchain $MLP1_TOOLCHAIN_IMAGE is unavailable; the package cannot be built."
            exit 1
          fi

      # Builds both packages and runs package_check (this also exercises the
      # assembly qualifier, which fails the build if a pruned module, forbidden
      # import, banned symbol or config reader reappears from upstream). Then
      # cuts the corresponding-source archive and rebuilds both packages from
      # it alone, offline; the ZIPs must be identical.
      - name: Build and check both packages, and rebuild them from the corresponding source
        working-directory: Leaf-RAOfflineProxy-Pak
        env:
          MLP1_TOOLCHAIN_IMAGE: ${{ steps.release-lock.outputs.toolchain }}
        run: make test-package test-dist-source DIST_SOURCE_REBUILD=1

      # The independent arm64 half of the reproducibility gate: print what
      # this runner built so it can be compared with two clean local builds.
      # The pak ZIPs pin every entry to 1980-01-01; the runtime ZIP pins its
      # entries to the lock's SOURCE_DATE_EPOCH in UTC.
      - name: Print package identities
        working-directory: Leaf-RAOfflineProxy-Pak/build/mlp1
        run: |
          sha256sum RAOfflineProxy.mlp1.pak.zip floor/RAOfflineProxy.mlp1.pak.zip \
            runtime/raofflineproxy-mlp1-runtime-*.zip rchash/libraproxy_rchash.so \
            ../dist/raofflineproxy-*-source.tar.gz
          for tree in package app; do
            printf '%s tree ' "$tree"
            (cd "$tree" && find . -type f | LC_ALL=C sort | xargs sha256sum | sha256sum)
          done
          # Per-file listing, so a mismatch against a local build names the
          # files that differ instead of only an aggregate.
          echo "--- package tree files"
          (cd package && find . -type f | LC_ALL=C sort | xargs sha256sum)

      # The runtime's build-configuration record is the file most exposed to
      # host differences; keep it (and the manifest that hashes it) so a
      # mismatch can be diffed rather than guessed at.
      - name: Upload runtime configuration record
        uses: actions/upload-artifact@v4
        with:
          name: runtime-config-record
          path: |
            Leaf-RAOfflineProxy-Pak/build/mlp1/package/RAOfflineProxy.pak/runtime/lib/python3.13/_sysconfigdata__linux_aarch64-linux-gnu.py
            Leaf-RAOfflineProxy-Pak/build/mlp1/package/RAOfflineProxy.pak/runtime/.leaf-runtime-manifest.json
          include-hidden-files: true

      # Catalog version selection through Jawaka's real Pak Rat client at the
      # pinned commit, against a disposable local feed: below / at / above the
      # minimum, and the runtime gate's independent refusal.
      - name: Run the catalog selection smoke
        working-directory: Leaf-RAOfflineProxy-Pak
        run: make catalog-selection-smoke
